services:
  postgres:
    image: postgres:16-alpine
    container_name: javamaven-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daily2}
      POSTGRES_USER: ${POSTGRES_USER:-daily}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dailypw}
      # 한글 정렬/비교를 위한 초기화 옵션
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-5438}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 스키마는 애플리케이션 기동 시 Spring Boot 의 spring.sql.init 이 적용한다.
      # 스키마 파일: src/main/resources/schema.sql (dev/test 자동, prod 는 수동 적용)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daily} -d ${POSTGRES_DB:-daily2}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: local-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-okhwa2002@google.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-adminpw}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  pgadmin-data:
