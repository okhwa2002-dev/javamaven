spring:
  profiles:
    active: dev
server:
  port: 8081

logging:
  level:
    root: INFO

# Parameter security filter (SQL keyword + XSS pattern block).
# Defaults live in com.cmn.filter.ParamFilterProperties.
# Override here only when you need to disable it or extend the rule sets.
security:
  param-filter:
    enabled: true
  jwt:
    # 서명 키는 자격증명이므로 기본값을 두지 않는다. 32바이트 이상 필요.
    # 미설정 시 dev 는 임의 키를 생성하고(재기동 시 토큰 무효), prod 는 기동을 중단한다.
    secret: ${JWT_SECRET:}
    # 액세스 토큰은 짧게, 리프레시로 갱신하도록 한다.
    expiration-minutes: 15
    refresh-expiration-days: 14
    issuer: javamaven

# Actuator 기본 정책 (모든 프로필 공통, dev 에서 완화).
#   - 기본은 health 만 공개 (env/beans/mappings 등은 자격증명·구조 노출 위험)
#   - health.show-details: never  → 내부 컴포넌트 상태를 응답에 담지 않음
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5438/daily2}
    username: ${DB_USERNAME:daily}
    # 자격증명은 기본값 없이 환경변수로만 주입
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # schema.sql 을 기동 시 항상 실행 (재실행 안전 위해 CREATE ... IF NOT EXISTS 사용).
  # Testcontainer IT 도 dev 프로필로 동작하므로 여기 설정을 그대로 재사용한다.
  sql:
    init:
      mode: always

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.domain
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
    default-fetch-size: 100
    default-statement-timeout: 30

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

logging:
  level:
    root: INFO
    com: DEBUG
    org.mybatis: DEBUG
    org.springframework.jdbc.core: DEBUG

# dev 편의: 상태·메트릭·로거 확인용 엔드포인트 추가 공개.
# env/beans 같은 자격증명·내부구조 노출 엔드포인트는 여기서도 열지 않는다.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # 스키마 변경은 DBA 가 수동으로 적용. 앱은 절대 자동 실행하지 않는다.
  sql:
    init:
      mode: never

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.domain
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
    default-fetch-size: 100
    default-statement-timeout: 30

server:
  port: 80

# API 명세 외부 노출 방지를 위해 prod에서는 비활성화
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com: INFO
    org.mybatis: WARN
# 로그 파일 경로/롤링 정책은 logback-spring.xml 에서 관리한다 (LOG_DIR, LOG_NAME 로 재정의).
