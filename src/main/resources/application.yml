spring:
  profiles:
    active: dev
server:
  port: 8081

logging:
  level:
    root: INFO

# Parameter security filter (SQL keyword + XSS pattern block).
# Defaults live in com.cmn.filter.ParamFilterProperties.
# Override here only when you need to disable it or extend the rule sets.
security:
  param-filter:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5438/daily}
    username: ${DB_USERNAME:daily}
    # 자격증명은 기본값 없이 환경변수로만 주입
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.domain
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
    default-fetch-size: 100
    default-statement-timeout: 30

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

logging:
  level:
    root: INFO
    com: DEBUG
    org.mybatis: DEBUG
    org.springframework.jdbc.core: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.domain
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
    default-fetch-size: 100
    default-statement-timeout: 30

server:
  port: 80

# API 명세 외부 노출 방지를 위해 prod에서는 비활성화
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com: INFO
    org.mybatis: WARN
  file:
    name: D:\var\log\app\application.log
