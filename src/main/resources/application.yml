spring:
  profiles:
    active: dev
server:
  port: 8080

logging:
  level:
    root: INFO

# Parameter security filter (SQL keyword + XSS pattern block).
# Defaults live in com.cmn.filter.ParamFilterProperties.
# Override here only when you need to disable it or extend the rule sets.
security:
  param-filter:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5438/daily
    username: daily
    password: dailypw
    driver-class-name: org.postgresql.Driver

cors:
  allowed-origins: http://localhost:3000,http://localhost:8080

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.domain
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
    default-fetch-size: 100
    default-statement-timeout: 30

server:
  port: 8080

logging:
  level:
    root: INFO
    com: DEBUG
    org.mybatis: DEBUG
    org.springframework.jdbc.core: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.domain
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
    default-fetch-size: 100
    default-statement-timeout: 30

server:
  port: 80

logging:
  level:
    root: WARN
    com: INFO
    org.mybatis: WARN
  file:
    name: /var/log/app/application.log
